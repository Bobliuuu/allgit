<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" role="img" aria-labelledby="t d">
<title id="t">vcs remote architecture</title><desc id="d">Clients, the optional vcs-server validating writer, and the backend layout with the manifest CAS key and the GC handshake.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.m{font-size:11px}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mid{text-anchor:middle}.end{text-anchor:end}
.panel{stroke-width:1.2}.A,.B,.C,.kD{stroke-width:1.5}.kH{stroke-width:1.8}.kX{stroke-width:1.5}
.ln{stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
.ar{stroke-width:1.8;fill:none;marker-end:url(#ah)}
text{fill:#1f2328}.m{fill:#59636e}
.bg{fill:#ffffff}.sH{stroke:#bf8700}.sL{stroke:#8c959f}
.panel{fill:#f6f8fa;stroke:#d0d7de}
.kA{fill:#ddf4ff;stroke:#0969da}.kB{fill:#dafbe1;stroke:#1a7f37}.kC{fill:#fff1e5;stroke:#bc4c00}.kD{fill:#fbefff;stroke:#8250df}
.kH{fill:#fff8c5;stroke:#bf8700}.kX{fill:#ffebe9;stroke:#cf222e}
.ln,.ar{stroke:#8c959f}.fl{fill:#8c959f}
.dotA{fill:#0969da}.dotB{fill:#1a7f37}.dotC{fill:#bc4c00}.dotD{fill:#8250df}.dotH{fill:#bf8700}.dotX{fill:#cf222e}
.tA{fill:#0969da}.tB{fill:#1a7f37}.tC{fill:#bc4c00}.tX{fill:#cf222e}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.m{fill:#9198a1}
.bg{fill:#0d1117}.sH{stroke:#d29922}.sL{stroke:#6e7681}
.panel{fill:#161b22;stroke:#30363d}
.kA{fill:#0c2d6b;stroke:#58a6ff}.kB{fill:#0f2d1a;stroke:#3fb950}.kC{fill:#3d1f0a;stroke:#f0883e}.kD{fill:#2d1a52;stroke:#bc8cff}
.kH{fill:#3a2d00;stroke:#d29922}.kX{fill:#4c1417;stroke:#ff7b72}
.ln,.ar{stroke:#6e7681}.fl{fill:#6e7681}
.dotA{fill:#58a6ff}.dotB{fill:#3fb950}.dotC{fill:#f0883e}.dotD{fill:#bc8cff}.dotH{fill:#d29922}.dotX{fill:#ff7b72}
.tA{fill:#58a6ff}.tB{fill:#3fb950}.tC{fill:#f0883e}.tX{fill:#ff7b72}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker></defs>
<rect width="900" height="572" rx="10" class="bg"/>
<text x="24" y="32" class="t">Remote architecture: clients, vcs-server, object storage</text>
<text x="24" y="50" class="m">The remote is a directory, an S3-compatible bucket, or vcs-server in front of one; the manifest CAS is the source of truth</text>
<rect x="24" y="70" width="190" height="250" rx="10" class="panel"/>
<text x="40" y="92" class="h">Clients</text>
<rect x="40" y="106" width="158" height="40" rx="8" class="kA"/>
<text x="119" y="131" class="mono mid">vcs publish</text>
<rect x="40" y="158" width="158" height="40" rx="8" class="kA"/>
<text x="119" y="183" class="mono mid">vcs fetch / sync</text>
<rect x="40" y="210" width="158" height="40" rx="8" class="kA"/>
<text x="119" y="235" class="mono mid">vcs clone --zone</text>
<rect x="40" y="262" width="158" height="40" rx="8" class="kA"/>
<text x="119" y="287" class="mono mid">vcs lock / unlock</text>
<rect x="260" y="70" width="300" height="250" rx="10" class="panel"/>
<text x="276" y="92" class="h">vcs-server (optional)</text>
<rect x="276" y="102" width="268" height="32" rx="8" class="kD"/>
<text x="410" y="123" class="m mid">bearer token, role, zones</text>
<rect x="276" y="142" width="268" height="32" rx="8" class="kD"/>
<text x="410" y="163" class="m mid">PUT objects/..: body hash must equal key</text>
<rect x="276" y="182" width="268" height="32" rx="8" class="kD"/>
<text x="410" y="203" class="m mid">manifest write: zone policy, locks, monotonic</text>
<rect x="276" y="222" width="268" height="32" rx="8" class="kD"/>
<text x="410" y="243" class="m mid">read policy: per-zone id sets (RAM)</text>
<rect x="276" y="262" width="268" height="32" rx="8" class="kD"/>
<text x="410" y="283" class="m mid">hash-chained audit log, rate limits</text>
<text x="276" y="314" class="m">plain HTTP unless built with --features tls</text>
<rect x="606" y="70" width="270" height="250" rx="10" class="panel"/>
<text x="622" y="92" class="h">Backend: directory or S3</text>
<rect x="622" y="104" width="238" height="34" rx="8" class="kD"/>
<text x="632" y="126" class="mono">objects/&lt;hh&gt;/&lt;id&gt;</text>
<text x="850" y="126" class="m end">create-only</text>
<rect x="622" y="146" width="238" height="34" rx="8" class="kD"/>
<text x="632" y="168" class="mono">packs/*.pack, *.idx</text>
<text x="850" y="168" class="m end">per publish</text>
<rect x="622" y="188" width="238" height="34" rx="8" class="kD"/>
<text x="632" y="210" class="mono">tx/&lt;txid&gt;</text>
<text x="850" y="210" class="m end">create-only</text>
<rect x="622" y="230" width="238" height="34" rx="8" class="kH"/>
<text x="632" y="252" class="mono">manifest</text>
<text x="850" y="252" class="m end">CAS: If-Match</text>
<rect x="622" y="272" width="238" height="34" rx="8" class="kC"/>
<text x="632" y="294" class="mono">gc/lock, tomb/</text>
<text x="850" y="294" class="m end">GC coordination</text>
<path d="M202,170 L256,170" class="ar"/>
<path d="M564,170 L602,170" class="ar"/>
<path d="M119,326 C119,350 700,350 740,326" class="ln dash"/>
<text x="430" y="366" class="m mid">or directly: no server, the client talks to the directory or bucket itself</text>
<circle r="5" class="dotA" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.0510;0.1490;0.1500;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0500;0.1500;1" calcMode="linear" path="M202,170 L256,170"/></circle>
<circle r="5" class="dotA" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.1200;0.1210;0.2190;0.2200;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1200;0.2200;1" calcMode="linear" path="M564,170 L602,170"/></circle>
<circle r="5" class="dotA" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.2510;0.3490;0.3500;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.3500;1" calcMode="linear" path="M202,170 L256,170"/></circle>
<circle r="5" class="dotA" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3200;0.3210;0.4190;0.4200;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3200;0.4200;1" calcMode="linear" path="M564,170 L602,170"/></circle>
<circle r="6" class="dotH" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5010;0.5990;0.6000;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6000;1" calcMode="linear" path="M202,200 L256,200"/></circle>
<circle r="6" class="dotH" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.5800;0.5810;0.6790;0.6800;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5800;0.6800;1" calcMode="linear" path="M564,200 L602,200"/></circle>
<path d="M202,200 L256,200" class="ar" opacity="0.0"/>
<rect x="622" y="230" width="238" height="34" rx="8" fill="none" class="sH" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.7;0.85;1" values="0;0;1;0;0"/></rect>
<text x="230" y="150" class="m mid">objects</text>
<text x="230" y="220" class="m mid">CAS</text>
<rect x="24" y="384" width="852" height="170" rx="10" class="panel"/>
<text x="40" y="406" class="h">vcs gc --remote: one sweeper at a time, protected from racing publishes</text>
<rect x="40" y="420" width="146" height="76" rx="8" class="kC"/>
<text x="113" y="442" class="h mid">take gc/lock</text>
<text x="113" y="460" class="m mid">create-only, expiry,</text>
<text x="113" y="475" class="m mid">renewed by CAS</text>
<rect x="206" y="420" width="146" height="76" rx="8" class="kA"/>
<text x="279" y="442" class="h mid">mark</text>
<text x="279" y="460" class="m mid">roots: branch heads, tags,</text>
<text x="279" y="475" class="m mid">snapshots, applied window</text>
<path d="M188,458 L204,458" class="ar"/>
<rect x="372" y="420" width="146" height="76" rx="8" class="kD"/>
<text x="445" y="442" class="h mid">tomb</text>
<text x="445" y="460" class="m mid">candidates older than the</text>
<text x="445" y="475" class="m mid">grace period; touched = kept</text>
<path d="M354,458 L370,458" class="ar"/>
<rect x="538" y="420" width="146" height="76" rx="8" class="kH"/>
<text x="611" y="442" class="h mid">remark</text>
<text x="611" y="460" class="m mid">re-read manifest;</text>
<text x="611" y="475" class="m mid">reachable again = untombed</text>
<path d="M520,458 L536,458" class="ar"/>
<rect x="704" y="420" width="146" height="76" rx="8" class="kX"/>
<text x="777" y="442" class="h mid">delete</text>
<text x="777" y="460" class="m mid">pack index first;</text>
<text x="777" y="475" class="m mid">LeaseLost stops it</text>
<path d="M686,458 L702,458" class="ar"/>
<rect x="40" y="416" width="146" height="84" rx="9" fill="none" class="sH" stroke-width="3"><animate attributeName="x" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="40;206;372;538;704"/></rect>
<text x="40" y="520" class="m">A dedup hit on an old object refreshes its timestamp (touch). S3 has no conditional delete, so the tombstone handshake is what makes deletes safe.</text>
<text x="40" y="538" class="m">Compaction (gc --remote --compact) also takes gc/lock, merges the per-publish packs into few larger ones, and never drops garbage itself.</text>
</svg>


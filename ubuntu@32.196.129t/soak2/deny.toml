# cargo-deny configuration. Used by the advisory Audit workflow.
[advisories]
yanked = "warn"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "0BSD", "BSL-1.0",
]
confidence-threshold = 0.8

# webpki-roots (the CA bundle behind the optional `tls` feature) is data under CDLA-Permissive-2.0.
# Allowed for that crate only, so `cargo deny check licenses` passes without widening the list.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img" aria-labelledby="t d">
<title id="t">Atomic cross-zone publish</title><desc id="d">Animation: objects upload, then one conditional manifest write moves engine and assets heads together.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.m{font-size:11px}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mid{text-anchor:middle}.end{text-anchor:end}
.panel{stroke-width:1.2}.A,.B,.C,.kD{stroke-width:1.5}.kH{stroke-width:1.8}.kX{stroke-width:1.5}
.ln{stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
.ar{stroke-width:1.8;fill:none;marker-end:url(#ah)}
text{fill:#1f2328}.m{fill:#59636e}
.bg{fill:#ffffff}.sH{stroke:#bf8700}.sL{stroke:#8c959f}
.panel{fill:#f6f8fa;stroke:#d0d7de}
.kA{fill:#ddf4ff;stroke:#0969da}.kB{fill:#dafbe1;stroke:#1a7f37}.kC{fill:#fff1e5;stroke:#bc4c00}.kD{fill:#fbefff;stroke:#8250df}
.kH{fill:#fff8c5;stroke:#bf8700}.kX{fill:#ffebe9;stroke:#cf222e}
.ln,.ar{stroke:#8c959f}.fl{fill:#8c959f}
.dotA{fill:#0969da}.dotB{fill:#1a7f37}.dotC{fill:#bc4c00}.dotD{fill:#8250df}.dotH{fill:#bf8700}.dotX{fill:#cf222e}
.tA{fill:#0969da}.tB{fill:#1a7f37}.tC{fill:#bc4c00}.tX{fill:#cf222e}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.m{fill:#9198a1}
.bg{fill:#0d1117}.sH{stroke:#d29922}.sL{stroke:#6e7681}
.panel{fill:#161b22;stroke:#30363d}
.kA{fill:#0c2d6b;stroke:#58a6ff}.kB{fill:#0f2d1a;stroke:#3fb950}.kC{fill:#3d1f0a;stroke:#f0883e}.kD{fill:#2d1a52;stroke:#bc8cff}
.kH{fill:#3a2d00;stroke:#d29922}.kX{fill:#4c1417;stroke:#ff7b72}
.ln,.ar{stroke:#6e7681}.fl{fill:#6e7681}
.dotA{fill:#58a6ff}.dotB{fill:#3fb950}.dotC{fill:#f0883e}.dotD{fill:#bc8cff}.dotH{fill:#d29922}.dotX{fill:#ff7b72}
.tA{fill:#58a6ff}.tB{fill:#3fb950}.tC{fill:#f0883e}.tX{fill:#ff7b72}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker></defs>
<rect width="900" height="486" rx="10" class="bg"/>
<text x="24" y="32" class="t">Atomic cross-zone publish</text>
<text x="24" y="50" class="m">Objects first, dependencies before dependents; then one conditional write of the manifest makes everything visible at once</text>
<rect x="24" y="70" width="230" height="250" rx="10" class="panel"/>
<text x="40" y="92" class="h">Client: vcs publish</text>
<rect x="40" y="104" width="198" height="40" rx="8" class="kA"/>
<text x="139" y="122" class="mono mid">engine/  commit e3</text>
<text x="139" y="136" class="m mid">new head</text>
<rect x="40" y="154" width="198" height="40" rx="8" class="kB"/>
<text x="139" y="172" class="mono mid">assets/  commit a2</text>
<text x="139" y="186" class="m mid">new head</text>
<text x="40" y="222" class="m">to upload (post-order):</text>
<rect x="40" y="232" width="60" height="26" rx="6" class="kH"/>
<text x="70" y="249" class="mono mid">blob</text>
<rect x="106" y="232" width="60" height="26" rx="6" class="kD"/>
<text x="136" y="249" class="mono mid">tree</text>
<rect x="172" y="232" width="60" height="26" rx="6" class="kA"/>
<text x="202" y="249" class="mono mid">commit</text>
<rect x="40" y="266" width="60" height="26" rx="6" class="kH"/>
<text x="70" y="283" class="mono mid">blob</text>
<rect x="106" y="266" width="60" height="26" rx="6" class="kD"/>
<text x="136" y="283" class="mono mid">tree</text>
<rect x="172" y="266" width="60" height="26" rx="6" class="kB"/>
<text x="202" y="283" class="mono mid">commit</text>
<text x="40" y="306" class="m">Collect prunes at objects the remote has.</text>
<rect x="400" y="70" width="476" height="250" rx="10" class="panel"/>
<text x="416" y="92" class="h">Remote (directory, S3 or vcs-server)</text>
<rect x="416" y="104" width="200" height="96" rx="8" class="kD"/>
<text x="516" y="124" class="h mid">objects/  (create-only)</text>
<rect x="632" y="104" width="228" height="40" rx="8" class="kD"/>
<text x="746" y="123" class="mono mid">tx/&lt;txid&gt;  (create-only)</text>
<rect x="632" y="154" width="228" height="150" rx="8" class="kH"/>
<text x="746" y="174" class="h mid">manifest (one key)</text>
<rect x="428" y="136" width="50" height="20" rx="5" class="kH" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.1000;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<rect x="488" y="136" width="50" height="20" rx="5" class="kD" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.1500;0.1700;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<rect x="548" y="136" width="50" height="20" rx="5" class="kA" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2200;0.2400;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<rect x="428" y="164" width="50" height="20" rx="5" class="kH" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2900;0.3100;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<rect x="488" y="164" width="50" height="20" rx="5" class="kD" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.3600;0.3800;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<rect x="548" y="164" width="50" height="20" rx="5" class="kB" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.4300;0.4500;0.9700;1.0000" values="0;0;1;1;0"/></rect>
<text x="516" y="216" class="m mid">exists remotely ⇒ its closure exists</text>
<g><text x="746" y="198" class="mono mid">generation N</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0000;0.0100;0.6600;0.6700;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="746" y="198" class="mono mid">generation N+1</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.6600;0.6800;0.9700;1.0000" values="0;0;1;1;0"/></g>
<text x="660" y="230" class="m">engine  </text>
<text x="660" y="252" class="m">assets</text>
<g><text x="716" y="230" class="mono">e2</text><text x="716" y="252" class="mono">a1</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0000;0.0100;0.6600;0.6700;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="716" y="230" class="mono">e3</text><text x="716" y="252" class="mono">a2</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.6600;0.6800;0.9700;1.0000" values="0;0;1;1;0"/></g>
<g opacity="0"><text x="746" y="282" class="m mid">applied += txid</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.6600;0.6800;0.9700;1.0000" values="0;0;1;1;0"/></g>
<rect x="632" y="154" width="228" height="150" rx="8" fill="none" class="sH" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.64;0.68;0.80;1" values="0;0;1;0;0"/></rect>
<circle r="6" class="dotH" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0600;0.0610;0.1290;0.1300;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0600;0.1300;1" calcMode="linear" path="M246,245 L438,146"/></circle>
<circle r="6" class="dotD" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.1250;0.1260;0.1940;0.1950;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1250;0.1950;1" calcMode="linear" path="M246,245 L498,146"/></circle>
<circle r="6" class="dotA" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.1900;0.1910;0.2590;0.2600;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1900;0.2600;1" calcMode="linear" path="M246,245 L558,146"/></circle>
<circle r="6" class="dotH" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2550;0.2560;0.3240;0.3250;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2550;0.3250;1" calcMode="linear" path="M246,279 L438,174"/></circle>
<circle r="6" class="dotD" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.3200;0.3210;0.3890;0.3900;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3200;0.3900;1" calcMode="linear" path="M246,279 L498,174"/></circle>
<circle r="6" class="dotB" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.3850;0.3860;0.4540;0.4550;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3850;0.4550;1" calcMode="linear" path="M246,279 L558,174"/></circle>
<circle r="7" class="dotD" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.4500;0.4510;0.5490;0.5500;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4500;0.5500;1" calcMode="linear" path="M246,170 L630,124"/></circle>
<circle r="8" class="dotH" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.5800;0.5810;0.6590;0.6600;1.0000" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5800;0.6600;1" calcMode="linear" path="M246,150 L630,222"/></circle>
<g><text x="400" y="346" class="h">1  Upload objects, one by one (a crash here leaves only unreachable objects)</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0000;0.0200;0.4500;0.4700;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="400" y="346" class="h">2  PutTx: the immutable transaction record (still invisible)</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.4500;0.4700;0.5600;0.5800;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="400" y="346" class="h">3  Load manifest N; refuse if an old head differs (Diverged)</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.5600;0.5800;0.6400;0.6600;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="400" y="346" class="h">4  Cas: If-Match on the manifest. This is the linearization point</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.6400;0.6600;0.8600;0.8800;1.0000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><text x="400" y="346" class="h">Visible at one instant: both zone heads moved, or neither</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.8600;0.8800;1.0000;1.0000;1.0000" values="0;0;1;1;0;0"/></g>
<rect x="24" y="362" width="852" height="106" rx="10" class="panel"/>
<text x="40" y="384" class="h">Why it is safe</text>
<text x="40" y="404" class="m">Before the CAS a reader sees manifest N and a consistent older state. If the CAS is lost (another publisher won), the writer reloads</text>
<text x="40" y="420" class="m">and re-checks only its own old heads, so publishers on disjoint branches both succeed. A repeated txid in manifest.applied is AlreadyApplied.</text>
<text x="40" y="440" class="m">Steps are idempotent (Collect, Upload*, PutTx, Load, Cas); an outcome that cannot be determined is reported Unknown, and re-running the same</text>
<text x="40" y="456" class="m">transaction converges. The crate's executable model explores crashes and lost requests across two writers.</text>
<g opacity="0"><text x="746" y="137" class="m mid">engine e2→e3, assets a1→a2</text><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.5500;0.5700;0.9700;1.0000" values="0;0;1;1;0"/></g>
</svg>


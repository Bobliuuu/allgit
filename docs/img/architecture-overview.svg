<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d"><title id="t">vcs architecture overview</title><desc id="d">Layered architecture: front ends, repository layer, global object graph, remote protocol with CAS manifest, and three backends.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.m{font-size:11px;fill:#59636e}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mid{text-anchor:middle}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bg{fill:#ffffff}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.a{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.b{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.c{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.k{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8}
.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{stroke:#8c959f;stroke-width:1.8;fill:none;marker-end:url(#ah)}.fl{fill:#8c959f}
.dA{fill:#0969da}.dB{fill:#1a7f37}.dC{fill:#bc4c00}.dD{fill:#8250df}

</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fl"/></marker></defs>
<rect class="bg" width="900" height="430"/>
<text x="24" y="34" class="t">vcs architecture: from scratch, no git, no libgit2</text><text x="24" y="54" class="m">Every layer is own code. Arrows point from caller to callee. Crate names under each box.</text><rect class="d" x="24" y="76" width="852" height="50" rx="8"/><text x="450.0" y="97.0" class="mid h">Front ends: vcs (native)  |  vcs git (argument map)  |  vcs p4 (argument map)  |  git-remote-allgit</text><text x="450.0" y="113.0" class="mid m">vcs-cli</text><rect class="a" x="24" y="146" width="420" height="86" rx="8"/><text x="234.0" y="177.0" class="mid h">Repository layer</text><text x="234.0" y="193.0" class="mid m">zones, refs, index, op log, change ids, first-class conflicts, locks, GC, import/export</text><text x="234.0" y="209.0" class="mid m">vcs-repo, vcs-merge</text><rect class="b" x="456" y="146" width="420" height="86" rx="8"/><text x="666.0" y="177.0" class="mid h">Global object graph</text><text x="666.0" y="193.0" class="mid m">BLAKE3 ids, canonical codec, chunked large files, lazy tag table</text><text x="666.0" y="209.0" class="mid m">vcs-objects, vcs-store (loose, pack v2/v3, chunk manifests)</text><rect class="k" x="24" y="252" width="852" height="64" rx="8"/><text x="450.0" y="280.0" class="mid h">Remote protocol: objects first, then ONE compare-and-swap of the manifest (atomic publish)</text><text x="450.0" y="296.0" class="mid m">publish step machine, remote packs, sparse and lazy fetch, executable model checker  |  vcs-remote</text><rect class="c" x="24" y="336" width="270" height="76" rx="8"/><text x="159.0" y="370.0" class="mid h">Directory</text><text x="159.0" y="386.0" class="mid m">shared disk, tests</text><rect class="c" x="315" y="336" width="270" height="76" rx="8"/><text x="450.0" y="362.0" class="mid h">S3-compatible bucket</text><text x="450.0" y="378.0" class="mid m">If-Match CAS, no server needed</text><text x="450.0" y="394.0" class="mid m">vcs-store-s3</text><rect class="c" x="606" y="336" width="270" height="76" rx="8"/><text x="741.0" y="370.0" class="mid h">vcs-server (+ read-through peers)</text><text x="741.0" y="386.0" class="mid m">group commit, tokens, roles, lock enforcement</text><path class="ar" d="M450 126V146"/><path class="ar" d="M234 232V252"/><path class="ar" d="M666 232V252"/><path class="ar" d="M159 316V336"/><path class="ar" d="M450 316V336"/><path class="ar" d="M741 316V336"/>
</svg>

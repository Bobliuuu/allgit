<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" role="img" aria-labelledby="t d">
<title id="t">vcs object model</title><desc id="d">One global content-addressed object graph, zones with their own commit DAGs, and a CAS manifest that linearizes atomic cross-zone transactions.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.m{font-size:11px}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mid{text-anchor:middle}.end{text-anchor:end}
.panel{stroke-width:1.2}.A,.B,.C,.kD{stroke-width:1.5}.kH{stroke-width:1.8}.kX{stroke-width:1.5}
.ln{stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
.ar{stroke-width:1.8;fill:none;marker-end:url(#ah)}
text{fill:#1f2328}.m{fill:#59636e}
.bg{fill:#ffffff}.sH{stroke:#bf8700}.sL{stroke:#8c959f}
.panel{fill:#f6f8fa;stroke:#d0d7de}
.kA{fill:#ddf4ff;stroke:#0969da}.kB{fill:#dafbe1;stroke:#1a7f37}.kC{fill:#fff1e5;stroke:#bc4c00}.kD{fill:#fbefff;stroke:#8250df}
.kH{fill:#fff8c5;stroke:#bf8700}.kX{fill:#ffebe9;stroke:#cf222e}
.ln,.ar{stroke:#8c959f}.fl{fill:#8c959f}
.dotA{fill:#0969da}.dotB{fill:#1a7f37}.dotC{fill:#bc4c00}.dotD{fill:#8250df}.dotH{fill:#bf8700}.dotX{fill:#cf222e}
.tA{fill:#0969da}.tB{fill:#1a7f37}.tC{fill:#bc4c00}.tX{fill:#cf222e}

</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker></defs>
<rect width="900" height="482" rx="10" class="bg"/>
<text x="24" y="32" class="t">One global object graph, many zones</text>
<text x="24" y="50" class="m">Per-zone commit DAGs share one content-addressed store; one manifest, replaced by compare-and-swap, orders publishes</text>
<rect x="24" y="66" width="852" height="104" rx="10" class="panel"/>
<text x="38" y="86" class="h">Remote: the linearization point</text>
<rect x="40" y="98" width="230" height="60" rx="8" class="kH"/>
<text x="54" y="118" class="h">manifest (one key, CAS)</text>
<text x="54" y="136" class="mono">generation N  →  N+1</text>
<text x="54" y="150" class="m">heads per (zone, branch), applied txids</text>
<rect x="40" y="98" width="230" height="60" rx="8" fill="none" class="sH" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.56;0.8;1" values="0;0;1;0;0"/></rect>
<path d="M270,128 L300,128" class="ar"/>
<rect x="304" y="100" width="100" height="56" rx="8" class="kD"/>
<text x="354" y="122" class="h mid">tx T1</text>
<text x="354" y="142" class="m mid">engine + assets</text>
<rect x="414" y="100" width="100" height="56" rx="8" class="kD"/>
<text x="464" y="122" class="h mid">tx T2</text>
<text x="464" y="142" class="m mid">root</text>
<rect x="524" y="100" width="100" height="56" rx="8" class="kD"/>
<text x="574" y="122" class="h mid">tx T3</text>
<text x="574" y="142" class="m mid">assets</text>
<text x="640" y="118" class="m">A Transaction is an immutable,</text>
<text x="640" y="133" class="m">create-only list of (zone, branch,</text>
<text x="640" y="148" class="m">old → new): one cross-zone publish.</text>
<rect x="24" y="184" width="540" height="196" rx="10" class="panel"/>
<text x="38" y="204" class="h">Zones: own branches, own commit DAG, no overlap</text>
<text x="40" y="238" class="h">root</text>
<circle cx="150" cy="234" r="11" class="kC"/>
<path d="M162,234 L238,234" class="ar"/>
<circle cx="250" cy="234" r="11" class="kC"/>
<path d="M262,234 L338,234" class="ar"/>
<circle cx="350" cy="234" r="11" class="kC"/>
<path d="M362,234 L438,234" class="ar"/>
<circle cx="450" cy="234" r="11" class="kC"/>
<text x="468" y="238" class="m">head</text>
<text x="40" y="294" class="h">engine/</text>
<circle cx="190" cy="290" r="11" class="kA"/>
<path d="M202,290 L308,290" class="ar"/>
<circle cx="320" cy="290" r="11" class="kA"/>
<path d="M332,290 L438,290" class="ar"/>
<circle cx="450" cy="290" r="11" class="kA"/>
<text x="468" y="294" class="m">head</text>
<text x="40" y="350" class="h">assets/</text>
<circle cx="210" cy="346" r="11" class="kB"/>
<path d="M222,346 L318,346" class="ar"/>
<circle cx="330" cy="346" r="11" class="kB"/>
<path d="M342,346 L438,346" class="ar"/>
<circle cx="450" cy="346" r="11" class="kB"/>
<text x="468" y="350" class="m">head</text>
<path d="M450,302 L450,334" class="ln sH" stroke-width="3"/>
<text x="470" y="322" class="h">T1</text>
<text x="500" y="322" class="m">moved both</text>
<text x="500" y="336" class="m">in one CAS</text>
<rect x="584" y="184" width="292" height="196" rx="10" class="panel"/>
<text x="598" y="204" class="h">One store, all zones</text>
<rect x="600" y="217" width="100" height="34" rx="8" class="kC"/>
<text x="650.0" y="238.0" class="mono mid">Tree (root)</text>
<rect x="600" y="273" width="100" height="34" rx="8" class="kA"/>
<text x="650.0" y="294.0" class="mono mid">Tree (engine)</text>
<rect x="600" y="329" width="100" height="34" rx="8" class="kB"/>
<text x="650.0" y="350.0" class="mono mid">Tree (assets)</text>
<rect x="760" y="264" width="100" height="34" rx="8" class="kH"/>
<text x="810.0" y="285.0" class="mono mid">Blob</text>
<rect x="760" y="329" width="100" height="34" rx="8" class="kD"/>
<text x="810.0" y="350.0" class="mono mid">Chunked 7 / 9</text>
<path d="M494,234 L598,234" class="ln dash"/><path d="M494,290 L598,290" class="ln dash"/><path d="M494,346 L598,346" class="ln dash"/>
<path d="M700,290 L760,281" class="ln"/><path d="M700,346 L762,292" class="ln"/><path d="M700,346 L760,346" class="ln"/>
<text x="760" y="222" class="m">shared blob: stored</text>
<text x="760" y="236" class="m">once, used by both</text>
<rect x="24" y="394" width="852" height="72" rx="10" class="panel"/>
<text x="40" y="416" class="m">id = BLAKE3(kind, version, payload); one reachability walk for GC: heads → commits → trees → blobs and chunks.</text>
<text x="40" y="436" class="m">No forced total order between zones: consistency is what a Transaction moved together or a Snapshot pins together.</text>
<text x="40" y="456" class="m">A zone name embedded in commits is its permanent id; a rename only changes a display name.</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d"><title id="t">Group commit</title><desc id="d">Animation: many publishers send publishes to vcs-server which merges them into one compare-and-swap write of the manifest.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.m{font-size:11px;fill:#59636e}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mid{text-anchor:middle}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bg{fill:#fcfcfb}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.a{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.b{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.c{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.k{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8}
.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{stroke:#8c959f;stroke-width:1.8;fill:none;marker-end:url(#ah)}.fl{fill:#8c959f}
.dA{fill:#0969da}.dB{fill:#1a7f37}.dC{fill:#bc4c00}.dD{fill:#8250df}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.m{fill:#9198a1}.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}
.a{fill:#0c2d6b;stroke:#58a6ff}.b{fill:#0f2d1a;stroke:#3fb950}.c{fill:#3d1f0a;stroke:#f0883e}.d{fill:#2d1a52;stroke:#bc8cff}.k{fill:#3a2d00;stroke:#d29922}
.ln,.ar{stroke:#6e7681}.fl{fill:#6e7681}.dA{fill:#58a6ff}.dB{fill:#3fb950}.dC{fill:#f0883e}.dD{fill:#bc8cff}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fl"/></marker></defs>
<rect class="bg" width="900" height="430"/>
<text x="24" y="34" class="t">Group commit: N contending publishers, one manifest write</text><text x="24" y="54" class="m">Animated. Without it every writer races one key (96.9% of CAS rounds lost at 512 writers). Source: docs/scalability.md finding 6.</text><rect class="box" x="24" y="90" width="170" height="250" rx="8"/><text x="109.0" y="112" class="mid h">Publishers</text><text x="109.0" y="128" class="mid m">objects first, then publish</text><rect class="a" x="300" y="90" width="280" height="250" rx="8"/><text x="440.0" y="112" class="mid h">vcs-server</text><text x="440.0" y="128" class="mid m">validates each publish,</text><text x="440.0" y="144" class="mid m">reconciles stale writes,</text><text x="440.0" y="160" class="mid m">merges disjoint ones</text><rect class="k" x="690" y="150" width="186" height="130" rx="8"/><text x="783.0" y="203.0" class="mid h">manifest</text><text x="783.0" y="219.0" class="mid m">one key, CAS on</text><text x="783.0" y="235.0" class="mid m">the current tag</text><rect class="c" x="690" y="300" width="186" height="70" rx="8"/><text x="783.0" y="331.0" class="mid h">objects/ packs/</text><text x="783.0" y="347.0" class="mid m">immutable, cached forever</text><circle r="7" class="dA" cx="60" cy="170"><animate attributeName="cx" values="60;300;300" keyTimes="0;0.35;1" dur="4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="cy" values="170;170;215" keyTimes="0;0.35;1" dur="4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="7" class="dA" cx="60" cy="205"><animate attributeName="cx" values="60;300;300" keyTimes="0;0.35;1" dur="4s" begin="0.25s" repeatCount="indefinite"/><animate attributeName="cy" values="205;205;215" keyTimes="0;0.35;1" dur="4s" begin="0.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="4s" begin="0.25s" repeatCount="indefinite"/></circle><circle r="7" class="dA" cx="60" cy="240"><animate attributeName="cx" values="60;300;300" keyTimes="0;0.35;1" dur="4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cy" values="240;240;215" keyTimes="0;0.35;1" dur="4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle><circle r="7" class="dA" cx="60" cy="275"><animate attributeName="cx" values="60;300;300" keyTimes="0;0.35;1" dur="4s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="cy" values="275;275;215" keyTimes="0;0.35;1" dur="4s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="4s" begin="0.75s" repeatCount="indefinite"/></circle><circle r="7" class="dA" cx="60" cy="310"><animate attributeName="cx" values="60;300;300" keyTimes="0;0.35;1" dur="4s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="cy" values="310;310;215" keyTimes="0;0.35;1" dur="4s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.45;1" dur="4s" begin="1.0s" repeatCount="indefinite"/></circle><circle r="11" class="dD" cx="440" cy="215"><animate attributeName="cx" values="440;440;690;690" keyTimes="0;0.5;0.8;1" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.9;1" dur="4s" repeatCount="indefinite"/></circle><path class="ar" d="M194 215H300"/><path class="ar" d="M580 215H690"/><text x="440" y="388" class="mid m">512 writers, medians of 3: 27.3 to 69.7 publishes/s, p95 37.2 s to 8.5 s, 67.8 to 5.3 requests per publish</text><text x="440" y="410" class="mid m">Clients keep the txid/applied protocol, so a lost ack is still safe. Direct-to-S3 publishers (no server) are unchanged.</text>
</svg>

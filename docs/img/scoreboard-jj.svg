<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 714" width="440" height="714" font-family="system-ui,sans-serif" font-size="13" role="img" aria-label="vcs vs Jujutsu (jj) scoreboard">
<style>:root{--bg:#fff;--fg:#1b1f24;--grid:#d0d7de;--win:#1a7f37;--tie:#9a6700;--loss:#cf222e;--na:#8c959f;--on:#fff}.bg{fill:#fff}.t{fill:var(--fg)}.h{font-weight:600}.sm{font-size:11px;opacity:.8}.c{fill:var(--on);text-anchor:middle;font-weight:600}</style>
<rect class="bg" width="440" height="714"/>
<text class="t h" x="12" y="26" font-size="17">allgit vcs vs Jujutsu (jj): per-command scoreboard</text>
<text class="t sm" x="12" y="46">cell = jj median wall / vcs median wall (ratio; above 1 means vcs is faster). WIN: wall and cpu both 5% better outside the MAD noise, LOSS: both 5% worse, else TIE.</text>
<text class="t sm" x="12" y="62">N/A = no equivalent command or failed. Final run, build 845610a, Xeon 8375C 16 vCPU, 100k flat, 9 interleaved runs.</text>
<text class="t h" x="345.0" y="84" text-anchor="middle">flat</text>
<text class="t" x="12" y="111.0">init (empty dir)</text>
<rect x="273" y="95" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="111.0">2.17x WIN</text>
<text class="t" x="12" y="141.0">add/track (all files)</text>
<rect x="273" y="125" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="141.0">158.51x WIN</text>
<text class="t" x="12" y="171.0">commit (all files)</text>
<rect x="273" y="155" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="171.0">1.07x WIN</text>
<text class="t" x="12" y="201.0">status (clean)</text>
<rect x="273" y="185" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="201.0">1.19x WIN</text>
<text class="t" x="12" y="231.0">status (1% modified)</text>
<rect x="273" y="215" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="231.0">11.67x WIN</text>
<text class="t" x="12" y="261.0">diff (1% modified)</text>
<rect x="273" y="245" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="261.0">18.12x WIN</text>
<text class="t" x="12" y="291.0">log (50 commits)</text>
<rect x="273" y="275" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="291.0">14.28x WIN</text>
<text class="t" x="12" y="321.0">blame/annotate (1 file)</text>
<rect x="273" y="305" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="321.0">7.54x WIN</text>
<text class="t" x="12" y="351.0">describe/metaedit (message)</text>
<rect x="273" y="335" width="144" height="24" rx="4" fill="var(--na)"/>
<text class="c" x="345.0" y="351.0">N/A</text>
<text class="t" x="12" y="381.0">branch/bookmark (create)</text>
<rect x="273" y="365" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="381.0">30.26x WIN</text>
<text class="t" x="12" y="411.0">checkout/switch (1% differ)</text>
<rect x="273" y="395" width="144" height="24" rx="4" fill="var(--tie)"/>
<text class="c" x="345.0" y="411.0">0.55x TIE</text>
<text class="t" x="12" y="441.0">amend (1 file)</text>
<rect x="273" y="425" width="144" height="24" rx="4" fill="var(--na)"/>
<text class="c" x="345.0" y="441.0">N/A</text>
<text class="t" x="12" y="471.0">undo (last commit)</text>
<rect x="273" y="455" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="471.0">1.18x WIN</text>
<text class="t" x="12" y="501.0">merge (disjoint files)</text>
<rect x="273" y="485" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="501.0">3.03x WIN</text>
<text class="t" x="12" y="531.0">rebase (1 commit onto main)</text>
<rect x="273" y="515" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="531.0">7.15x WIN</text>
<text class="t" x="12" y="561.0">push (1 new commit)</text>
<rect x="273" y="545" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="561.0">10.01x WIN</text>
<text class="t" x="12" y="591.0">clone (local remote, full history)</text>
<rect x="273" y="575" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="591.0">3.32x WIN</text>
<text class="t" x="12" y="621.0">fetch/pull (1 new commit)</text>
<rect x="273" y="605" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="621.0">5.13x WIN</text>
<text class="t" x="12" y="651.0">gc (local)</text>
<rect x="273" y="635" width="144" height="24" rx="4" fill="var(--win)"/>
<text class="c" x="345.0" y="651.0">11.02x WIN</text>
<text class="t h" x="12" y="696">Totals: 16 WIN, 1 TIE, 0 LOSS, 2 N/A</text>
</svg>
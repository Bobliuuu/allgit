<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="t d"><title id="t">Automatic zone selection</title><desc id="d">Local usage profile feeds a predictor that picks hot zones to download fully while other zones get metadata only.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.m{font-size:11px;fill:#59636e}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mid{text-anchor:middle}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bg{fill:#fcfcfb}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.a{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.b{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.c{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.k{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8}
.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{stroke:#8c959f;stroke-width:1.8;fill:none;marker-end:url(#ah)}.fl{fill:#8c959f}
.dA{fill:#0969da}.dB{fill:#1a7f37}.dC{fill:#bc4c00}.dD{fill:#8250df}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.m{fill:#9198a1}.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}
.a{fill:#0c2d6b;stroke:#58a6ff}.b{fill:#0f2d1a;stroke:#3fb950}.c{fill:#3d1f0a;stroke:#f0883e}.d{fill:#2d1a52;stroke:#bc8cff}.k{fill:#3a2d00;stroke:#d29922}
.ln,.ar{stroke:#6e7681}.fl{fill:#6e7681}.dA{fill:#58a6ff}.dB{fill:#3fb950}.dC{fill:#f0883e}.dD{fill:#bc8cff}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fl"/></marker></defs>
<rect class="bg" width="900" height="370"/>
<text x="24" y="34" class="t">Automatic zone selection from a local usage profile</text><text x="24" y="54" class="m">No model, no telemetry, no upload. The profile holds zone id + directory prefix (at most 3 components), never file names. Source: docs/zone-profile.md.</text><rect class="d" x="24" y="90" width="190" height="110" rx="8"/><text x="119.0" y="133.0" class="mid h">.vcs/profile</text><text x="119.0" y="149.0" class="mid m">edits, reads, builds</text><text x="119.0" y="165.0" class="mid m">by zone, last 5 days</text><rect class="a" x="280" y="90" width="190" height="110" rx="8"/><text x="375.0" y="133.0" class="mid h">Predictor</text><text x="375.0" y="149.0" class="mid m">hot zones + their</text><text x="375.0" y="165.0" class="mid m">dependencies (Cargo.toml etc)</text><rect class="b" x="536" y="90" width="170" height="50" rx="8"/><text x="621.0" y="119.0" class="mid h">Hot zones: contents</text><rect class="c" x="536" y="150" width="170" height="50" rx="8"/><text x="621.0" y="179.0" class="mid h">Other zones: metadata</text><rect class="k" x="760" y="90" width="116" height="110" rx="8"/><text x="818.0" y="141.0" class="mid h">sync --auto</text><text x="818.0" y="157.0" class="mid m">clone --auto</text><path class="ar" d="M214 145H280"/><path class="ar" d="M470 115H536"/><path class="ar" d="M470 175H536"/><path class="ar" d="M706 145H760"/><rect class="box" x="24" y="230" width="852" height="100" rx="8"/><text x="450.0" y="268.0" class="mid h">Measured (50 zones, 100,051 files, loopback, docs/research/zone-profile-bench.md)</text><text x="450.0" y="284.0" class="mid m">clone: 37.0 MB vs 189.5 MB full vcs; 1.16 s vs 3.68 s for git partial+sparse given the same zones (bytes tie).</text><text x="450.0" y="300.0" class="mid m">Honest: 71 requests vs 28; git pull beats vcs sync --auto on incremental updates (0.29 s vs 0.78 s).</text><text x="450" y="352" class="mid m">Every skipped zone stays listed and one command (vcs zone add / vcs profile fetch) brings it in. Agents read the same structure as JSON: vcs zone describe --json.</text>
</svg>

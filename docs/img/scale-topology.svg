<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d"><title id="t">Scale-out topology</title><desc id="d">Clients, read-through peers, origin server, S3 authority with CAS manifest, and zones.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.m{font-size:11px;fill:#59636e}.t{font-size:18px;font-weight:700}.h{font-weight:700}.mid{text-anchor:middle}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bg{fill:#fcfcfb}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.a{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.b{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.c{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.d{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.k{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8}
.ln{stroke:#8c959f;stroke-width:1.5;fill:none}.ar{stroke:#8c959f;stroke-width:1.8;fill:none;marker-end:url(#ah)}.fl{fill:#8c959f}
.dA{fill:#0969da}.dB{fill:#1a7f37}.dC{fill:#bc4c00}.dD{fill:#8250df}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.m{fill:#9198a1}.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}
.a{fill:#0c2d6b;stroke:#58a6ff}.b{fill:#0f2d1a;stroke:#3fb950}.c{fill:#3d1f0a;stroke:#f0883e}.d{fill:#2d1a52;stroke:#bc8cff}.k{fill:#3a2d00;stroke:#d29922}
.ln,.ar{stroke:#6e7681}.fl{fill:#6e7681}.dA{fill:#58a6ff}.dB{fill:#3fb950}.dC{fill:#f0883e}.dD{fill:#bc8cff}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fl"/></marker></defs>
<rect class="bg" width="1000" height="410"/>
<text x="24" y="34" class="t">Scaling out: one authority for writes, many caches for reads</text><text x="24" y="54" class="m">Only the manifest needs freshness; objects and packs are content-addressed and immutable. Source: docs/peering.md, docs/s3.md, docs/manifest-scaling.md.</text><rect class="d" x="24" y="90" width="200" height="230" rx="8"/><text x="124.0" y="177.0" class="mid h">Many clients</text><text x="124.0" y="193.0" class="mid m">pushers and cloners</text><text x="124.0" y="209.0" class="mid m">sparse: only their zones</text><text x="124.0" y="225.0" class="mid m">1M-file repos: clone 40 s</text><text x="124.0" y="241.0" class="mid m">(git 603 s)</text><rect class="a" x="300" y="90" width="200" height="100" rx="8"/><text x="400.0" y="128.0" class="mid h">Edge peer</text><text x="400.0" y="144.0" class="mid m">vcs-server --upstream</text><text x="400.0" y="160.0" class="mid m">disk cache, coalesced reads</text><rect class="a" x="300" y="220" width="200" height="100" rx="8"/><text x="400.0" y="258.0" class="mid h">Regional peer</text><text x="400.0" y="274.0" class="mid m">peers stack</text><text x="400.0" y="290.0" class="mid m">warm: 3 origin requests</text><rect class="b" x="580" y="90" width="200" height="100" rx="8"/><text x="680.0" y="128.0" class="mid h">Origin vcs-server</text><text x="680.0" y="144.0" class="mid m">validating writer</text><text x="680.0" y="160.0" class="mid m">group commit, locks, audit</text><rect class="k" x="580" y="220" width="200" height="100" rx="8"/><text x="680.0" y="258.0" class="mid h">Authority</text><text x="680.0" y="274.0" class="mid m">S3 bucket (If-Match CAS)</text><text x="680.0" y="290.0" class="mid m">or directory</text><rect class="c" x="820" y="90" width="160" height="230" rx="8"/><text x="900.0" y="177.0" class="mid h">Zones</text><text x="900.0" y="193.0" class="mid m">one global object graph,</text><text x="900.0" y="209.0" class="mid m">independent zone heads;</text><text x="900.0" y="225.0" class="mid m">disjoint publishers merge</text><text x="900.0" y="241.0" class="mid m">instead of fighting</text><path class="ar" d="M224 140H300"/><path class="ar" d="M224 270H300"/><path class="ar" d="M500 140H580"/><path class="ar" d="M500 270H580"/><path class="ar" d="M680 190V220"/><path class="ln" d="M780 270H820" stroke-dasharray="4 4"/><text x="500" y="350" class="mid m">Reads: peers answer from local disk, revalidate the manifest with If-None-Match (304 has no body).</text><text x="500" y="370" class="mid m">Writes: forwarded to the origin, decided by one CAS. 256 object-key prefixes avoid S3 hot partitions; the manifest is one key.</text><text x="500" y="390" class="mid m">Measured: batch of 64 to 256 clones cost the origin 3 requests with a warm peer (ttl 30 s). WAN bytes not measured.</text>
</svg>

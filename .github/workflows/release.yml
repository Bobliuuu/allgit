name: Release

# Builds `vcs` and `vcs-server` for macOS and Linux when a version tag is pushed and attaches the tarballs, CycloneDX
# SBOMs and a cosign-signed SHA256SUMS to a GitHub release. Every tarball and SBOM gets a GitHub build-provenance
# attestation, and a vcs-server container image is pushed to ghcr.io with its own provenance and SBOM
# (verification commands: docs/deploy.md, "Verify a release").
# workflow_dispatch runs everything except publishing (tarballs, SBOMs and an image build without push).
# Advisory only: nothing here is (or should be made) a required status check.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Release binaries use a pinned toolchain, not floating `stable`, so a release is reproducible from its tag.
  # Bump deliberately (CI itself keeps testing on `stable`).
  RELEASE_RUST: 1.99.1
  CARGO_CYCLONEDX_VERSION: 0.5.10

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macos-13 images were retired by GitHub (Dec 2025); a job on that label never starts
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner's absolute paths out of the binaries and pin embedded timestamps to the commit.
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --locked -p vcs-cli --target ${{ matrix.target }}
          # Same feature set as deploy/Dockerfile: HTTPS listener and https:// S3 endpoints.
          cargo build --release --locked -p vcs-server --bin vcs-server --features tls --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for bin in vcs vcs-server; do
            name="${bin}-${ref}-${{ matrix.target }}"
            mkdir -p "dist/${name}"
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
            cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
            tar -C dist -cf - "${name}" | gzip -n > "dist/${name}.tar.gz"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vcs-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: sbom
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
      - name: Generate
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-dev}"
          mkdir -p sbom
          # One SBOM per shipped binary; the server one is generated with the `tls` feature the release uses.
          cargo cyclonedx --manifest-path crates/vcs-cli/Cargo.toml --format json --override-filename sbom
          cargo cyclonedx --manifest-path crates/vcs-server/Cargo.toml --format json --features tls --override-filename sbom
          cp crates/vcs-cli/sbom.json "sbom/vcs-${ref}.cdx.json"
          cp crates/vcs-server/sbom.json "sbom/vcs-server-${ref}.cdx.json"
          python3 -c 'import json,sys; [print(f, len(json.load(open(f))["components"]), "components") for f in sys.argv[1:]]' sbom/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  image:
    name: container image (vcs-server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/vcs-server"
          ver="${GITHUB_REF_NAME#v}"
          tags="${image}:${ver}"
          # prereleases (1.2.3-rc1) do not move `latest`
          case "$ver" in *-*|"") ;; *) tags="${tags},${image}:latest";; esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on tags)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # BuildKit attaches an SLSA provenance and an SPDX SBOM of the image contents to the manifest list.
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - name: Attest image provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: publish release
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: vcs-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: sbom
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.cdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign SHA256SUMS (keyless, GitHub OIDC identity)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)

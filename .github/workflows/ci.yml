name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster, smaller CI builds: no incremental state to cache, no debuginfo.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p vcs-merge --all-targets --features structural -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test --workspace
      - run: cargo test -p vcs-merge --features structural

  s3:
    name: s3 (minio)
    # Informational: not in ci-ok needs, because MinIO distribution is unreliable.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Start MinIO
        run: |
          # Upstream stopped publishing MinIO binaries and images; build from source.
          # Pinned to the commit of tag RELEASE.2025-10-15T17-29-55Z (go install needs a semver or commit, not the tag).
          GOBIN="$PWD" go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup ./minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > minio.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          cat minio.log; echo "MinIO did not become healthy"; exit 1
      - run: cargo test -p vcs-store-s3 -p vcs-cli
        env:
          VCS_TEST_S3_ENDPOINT: http://127.0.0.1:9000

  # Advisory: compile-only on Windows (not in ci-ok). Nothing is executed on Windows here. Libraries and binaries
  # only: the test suites and the vcs-bench tools use Unix-only APIs (permissions, process groups, st_blocks).
  windows-check:
    name: windows-check (advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo check --workspace --exclude vcs-bench --lib --bins --target x86_64-pc-windows-msvc

  # Required (in ci-ok): the declared MSRV (workspace rust-version = 1.88). Promoted from advisory after a clean run
  # of both commands below on 1.88.0.
  msrv:
    name: msrv 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo check --workspace --exclude vcs-bench --locked
      - run: cargo check -p vcs-server --features tls --locked

  # Required: the deterministic cargo-deny checks (bans, sources, licenses). Advisories stay in audit.yml, where a
  # new RUSTSEC entry cannot turn an unrelated pull request red.
  deny:
    name: cargo-deny (bans sources licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans sources licenses

  # Advisory: the test suite on Linux aarch64 (the release ships aarch64-unknown-linux-gnu binaries).
  test-arm64:
    name: test (ubuntu-24.04-arm, advisory)
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test --workspace

  # Advisory: static musl build of the two shipped binaries. Compile-only: tests run on the glibc jobs above.
  musl:
    name: musl check (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo check --locked -p vcs-cli -p vcs-server --bins --target x86_64-unknown-linux-musl

  # Advisory: AddressSanitizer over the crates with unsafe code and mmap/FFI (objects, store, remote, repo) and Miri over
  # the pure codec/ID/object paths. Rust has no stable UBSan or TSan: -Zsanitizer=undefined is not supported and
  # ThreadSanitizer needs a full -Zbuild-std of every dependency; neither is run. Nightly is pinned to a date so a
  # nightly regression cannot redden the job; bump it deliberately.
  asan:
    name: asan (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SANITIZER_NIGHTLY: nightly-2026-11-05
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: ${{ env.SANITIZER_NIGHTLY }}
          components: rust-src
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: asan
      - name: cargo test under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
        run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p vcs-objects -p vcs-store -p vcs-remote -p vcs-repo --lib

  miri:
    name: miri (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANITIZER_NIGHTLY: nightly-2026-11-05
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: ${{ env.SANITIZER_NIGHTLY }}
          components: miri, rust-src
      # Only the quick tests: blake3 hashing under Miri makes the object, chunk and signing tests take over 9 minutes.
      - name: cargo miri test (vcs-objects codec, id, names)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"
        run: >
          cargo miri test -p vcs-objects --lib --
          codec:: id:: names::tests::names names::tests::paths

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, deny, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job finished with: $r"
              exit 1
            fi
          done

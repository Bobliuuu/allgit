[package]
name = "vcs-storage-lab"
version = "0.0.0"
edition = "2021"
publish = false
description = "Research lab for indexes and caches (epic #190, issue #185). Not part of the product; never a dependency of it."

# Standalone workspace: heavy optional deps (rocksdb needs libclang) and their Cargo.lock stay out of the product build.
[workspace]

[features]
default = ["sqlite", "redb"]
sqlite = ["dep:rusqlite"]
redb = ["dep:redb"]
rocks = ["dep:rocksdb"]

[dependencies]
vcs-store = { path = "../vcs-store" }
vcs-merge = { path = "../vcs-merge" }
vcs-objects = { path = "../vcs-objects" }
vcs-bench = { path = "../vcs-bench" }
vcs-repo = { path = "../vcs-repo" }
blake3 = "1"
boomphf = "0.6"
xorf = "0.11"
fst = "0.4"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
redb = { version = "2", optional = true }
rocksdb = { version = "0.22", default-features = false, optional = true }

[profile.release]
debug = false
opt-level = 3
lto = "thin"

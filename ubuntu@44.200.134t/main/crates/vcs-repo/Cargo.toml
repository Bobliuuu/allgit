[package]
name = "vcs-repo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vcs-objects.workspace = true
vcs-store.workspace = true
vcs-remote.workspace = true
vcs-merge.workspace = true
thiserror.workspace = true
blake3.workspace = true
unicode-normalization.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
sha2 = "0.10"
# The real-watcher tests in tests/fsmonitor.rs (dev-dependency cycle is fine: tests only).
vcs-watchd = { path = "../vcs-watchd" }

[features]
default = []
# Use the structural Rust merge in merge and rebase (see vcs-merge).
structural = ["vcs-merge/structural"]
structural-python = ["vcs-merge/structural-python"]
structural-typescript = ["vcs-merge/structural-typescript"]
structural-go = ["vcs-merge/structural-go"]

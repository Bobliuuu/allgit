intro: |
  <a id="video"></a>
  **vcs** is a version control system written from scratch in Rust, with **no git, no libgit2 and no Perforce underneath**. It is built for big repositories
  where code, art and docs should not share one history, where nobody wants to download everything, and where many people (and agents) push at once to an S3 bucket.
  The command is `vcs`; the repository is [Bobliuuu/allgit](https://github.com/Bobliuuu/allgit).

  > 🐣 Early research software, with no on-disk format promise yet. Much of it is tested, but parts have only been run against fixtures, local servers or a single cloud account.
  > Read [Limits](#caveats) before depending on it. The complete former front page (all benchmark tables, idea matrix, scoreboards) is kept in [docs/overview.md](docs/overview.md).

  <p align="center"><img src="docs/media/demo.gif" alt="Terminal demo: create two zones, publish, clone only the engine zone, then add the assets zone" width="820"></p>
  <p align="center"><sub>A real recorded run of the Quickstart ([provenance](docs/media/PROVENANCE.md)).</sub></p>

video:
  url: ""
  caption: "Explainer video (with voice-over and subtitles): zones, atomic publish, and the measured results including where git wins"
  mp4: video/allgit_explainer.mp4
  gif: video/preview.gif
  srt: video/allgit_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.15}
  scenes:
    - type: title
      title: vcs
      subtitle: One repository, many zones, any size
      chips: [Rust, zones, atomic publish, S3 manifest]
      say: "vcs: one repository, many zones, any size. A version control system written from scratch in Rust, with no git underneath. This is a short tour of the idea, the numbers we measured, and where it loses to git."
    - type: problem
      heading: The problem
      bullets:
        - "Big repos mix code, art and docs in one history"
        - "Everyone downloads everything, even the slice they never touch"
        - "Many writers, human and agent, publish at once to shared storage"
      say: "Big repositories mix code, art and documentation in one history. Everyone downloads everything, even the slice they never touch. And now many writers, people and agents, publish at the same time to shared storage."
    - type: architecture
      diagram: zones
      heading: "The idea: zones in one content-addressed store"
      say: "The idea is zones. Every object, a file chunk, tree, or commit, is named by its hash and stored once. A zone owns a path prefix and has its own branches and history. You subscribe only to the zones you need, and the others are never downloaded. A single manifest, replaced by compare and swap, makes a publish visible at one instant, across all zones."
    - type: terminal
      heading: "Quickstart"
      lines:
        - {cmd: "vcs init demo && cd demo"}
        - {cmd: "vcs zone create engine --path engine"}
        - {cmd: "vcs zone create assets --path assets"}
        - {cmd: "vcs add . && vcs commit -m initial"}
        - {out: "one atomic transaction covering 3 zones"}
        - {cmd: "vcs remote set ../shared.vcs && vcs publish"}
        - {out: "published atomically"}
        - {cmd: "vcs clone shared.vcs work --zone engine"}
        - {out: "assets: not subscribed, not downloaded, NOT deleted"}
      say: "Here is the quickstart. Create two zones, commit once, which is one atomic transaction across zones, publish to a shared location, and clone only the engine zone. The assets zone is not downloaded, and it is not deleted either; it is simply not there until you add it."
    - type: cards
      heading: "What is in the box"
      cards:
        - {title: "Local first", sub: "offline except sharing", lines: ["Operation log with undo", "Structured conflicts you can list and resolve"]}
        - {title: "S3 and server", sub: "CAS manifest", lines: ["Directory, S3-compatible bucket or vcs-server", "Protocol checked by an executable model"]}
        - {title: "Large files", sub: "built in", lines: ["Content-defined chunking, stored once", "Streaming add and checkout, no extra tool"]}
      footer: "{{ n.crates.text }} crates, {{ n.tests.text }} test functions, {{ n.rust_lines.text }} lines of Rust"
      say: "It works offline except for sharing, keeps an operation log with undo, and records conflicts as structured state. The remote can be a directory, an S3 compatible bucket, or a server, and the protocol is checked by an executable model. Large files are chunked and stored once, with no separate tool. The workspace has {{ n.crates.numtext }} crates and {{ n.tests.numtext }} test functions."
    - type: stat
      number: add_x
      kicker: "adding 1,000,000 files: git {{ n.add_git.text }}, vcs {{ n.add_vcs.text }}"
      label: faster than git
      sub: "one run, one machine, quiet box; raw data in the repo"
      say: "Now the numbers. On a million file tree, adding everything takes git {{ n.add_git.numtext }} seconds and vcs {{ n.add_vcs.numtext }}. That is {{ n.add_x.numtext }} times faster, from one run on one machine."
    - type: chart
      chart: ratios
      gif: video/ratios.gif
      gif_start: 0.4
      gif_end: 10
      gif_width: 900
      gif_fps: 10
      say: "Here is every operation on that tree, as git time divided by vcs time. Above one, vcs is faster. Diff of a one percent change is {{ n.diff_x.numtext }} times faster, and garbage collection {{ n.gc_x.numtext }} times. But below one, git wins. Adding when nothing changed takes git {{ n.noop_git.numtext }} seconds against {{ n.noop_vcs.numtext }} for vcs, and status with one percent modified is slightly slower too."
    - type: table
      table: huge_tbl
      heading: "1,000,000 files, every row"
      say: "Of the {{ n.cmp_rows.numtext }} operations that can be compared, vcs is faster on {{ n.vcs_wins.numtext }} and git on {{ n.git_wins.numtext }}. The clone row is not like for like, because a local path clone is the fast case for git too, so treat that one with care."
    - type: chart
      chart: zone_mb
      say: "Zones also save bytes. On a fifty zone repository, a full clone downloads {{ n.zone_full.numtext }} megabytes. When the zones are chosen from your usage profile, it downloads {{ n.zone_auto.numtext }}, which is {{ n.zone_saved.numtext }} percent less, in {{ n.zone_auto_s.numtext }} seconds instead of {{ n.zone_full_s.numtext }}."
    - type: caveats
      heading: "Honest limits"
      bullets:
        - "Early research software; the on-disk format may still change"
        - "Benchmarks are one machine, one build and few runs; git still wins several rows"
        - "Windows is only compile-checked; the AI merge helpers are mock-tested"
        - "Memory use on add, publish and clone is higher than git"
      say: "Honest limits. This is early research software and the on disk format may still change. Every benchmark is one machine, one build and a small number of runs, and git still wins several rows. Windows is only compile checked, the AI merge helpers are tested with mocks, and vcs uses more memory than git on add, publish and clone."
    - type: end
      title: vcs
      subtitle: "Code, raw benchmark data and full docs are in the repo"
      say: "vcs. The code, the raw benchmark data and the full documentation are in the repo."


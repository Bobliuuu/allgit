[package]
name = "vcs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Validating-writer HTTP server and HttpBackend client (optional rustls TLS via the `tls` feature)"

[features]
# HTTPS for server and client via rustls (certificate verification always on). Off by default so the
# default build has no TLS dependencies.
# Also turns on https:// S3 endpoints (vcs-store-s3/tls): real AWS S3 has no http endpoint, and without this a
# `--features tls` server refused every `--backend s3://...?endpoint=https://...` (docs/research/infra-review.md).
tls = ["ureq/tls", "dep:rustls", "vcs-store-s3/tls"]

[lib]
name = "vcs_server"
path = "src/lib.rs"

[[bin]]
name = "vcs-server"
path = "src/main.rs"

[dependencies]
vcs-remote.workspace = true
vcs-objects.workspace = true
vcs-store-s3.workspace = true
blake3.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
vcs-store.workspace = true
tempfile.workspace = true
rcgen = "0.14"
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[package]
name = "vcs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vcs"
path = "src/main.rs"

[features]
# https:// endpoints for s3:// remotes (rustls). Off by default to keep the build offline.
tls = ["vcs-store-s3/tls"]

[dependencies]
vcs-repo.workspace = true
vcs-objects.workspace = true
vcs-store.workspace = true
vcs-remote.workspace = true
vcs-store-s3.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "vcs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
vcs-repo.workspace = true
vcs-objects.workspace = true
vcs-store.workspace = true
vcs-remote.workspace = true
vcs-store-s3.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

[features]
default = []
# https:// endpoints for s3:// remotes (rustls). Off by default to keep the build offline.
tls = ["vcs-store-s3/tls"]
structural = ["vcs-repo/structural"]
structural-python = ["vcs-repo/structural-python"]
structural-typescript = ["vcs-repo/structural-typescript"]
structural-go = ["vcs-repo/structural-go"]

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"

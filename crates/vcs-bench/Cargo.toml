[package]
name = "vcs-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# https endpoints for s3bench; off by default so it does not turn TLS on for the whole workspace
s3-tls = ["vcs-store-s3/tls"]
# manifestbench: also measure the sharded-manifest prototype (#252)
sharded = ["vcs-remote/sharded"]

[dependencies]
vcs-objects.workspace = true
vcs-store.workspace = true
vcs-repo.workspace = true
vcs-remote.workspace = true
tempfile.workspace = true
blake3.workspace = true
vcs-store-s3 = { path = "../vcs-store-s3" }
sha2 = "0.10"
vcs-server = { path = "../vcs-server" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "chunkbench"
path = "src/bin/chunkbench.rs"

[[bin]]
name = "packbench"
path = "src/bin/packbench.rs"

[[bin]]
name = "s3bench"
path = "src/bin/s3bench.rs"
required-features = ["s3-tls"]

[[bin]]
name = "s3e2e"
path = "src/bin/s3e2e.rs"

[[bin]]
name = "zonebench"
path = "src/bin/zonebench.rs"

[[bin]]
name = "storebench"
path = "src/bin/storebench.rs"

[[bin]]
name = "auditprobe"
path = "src/bin/auditprobe.rs"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[[bench]]
name = "core"
harness = false

[[bin]]
name = "packfmtbench"
path = "src/bin/packfmtbench.rs"

[[bin]]
name = "manifestbench"
path = "src/bin/manifestbench.rs"

[[bin]]
name = "netbench"
path = "src/bin/netbench.rs"

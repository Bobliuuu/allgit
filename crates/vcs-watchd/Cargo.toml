[package]
name = "vcs-watchd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The filesystem watcher behind `vcs watch` (notify: inotify / FSEvents). Kept out of vcs-repo so the `vcs` binary does not link CoreServices (about 2 ms of dyld work per process on macOS)."

[dependencies]
vcs-repo.workspace = true
vcs-objects.workspace = true
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

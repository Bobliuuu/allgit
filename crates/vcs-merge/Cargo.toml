[package]
name = "vcs-merge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vcs-objects.workspace = true
vcs-store.workspace = true
thiserror.workspace = true
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }

[features]
default = []
# Experimental structural (syntax-aware) merge driver for Rust sources. Off by default.
structural = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[dev-dependencies]
proptest.workspace = true

[[example]]
name = "structural_corpus"
required-features = ["structural"]

[package]
name = "vcs-assist-claude"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vcs-assist-claude"
path = "src/main.rs"

[dependencies]
vcs-merge.workspace = true
ureq = { version = "2", default-features = false }
serde_json = "1"

[features]
# `tls` is needed for the real https://api.anthropic.com endpoint (rustls, certificates always verified).
# The structural features give a parse check of the proposal for Rust, Python, TypeScript and Go. They are off by
# default (like in vcs-merge) so that a workspace build does not switch the structural merge on for `vcs` itself.
default = ["tls"]
tls = ["ureq/tls"]
structural = ["vcs-merge/structural"]
structural-python = ["vcs-merge/structural-python"]
structural-typescript = ["vcs-merge/structural-typescript"]
structural-go = ["vcs-merge/structural-go"]

[dev-dependencies]
tempfile.workspace = true
